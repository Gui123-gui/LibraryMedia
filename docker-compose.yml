services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: librarymedia
      MYSQL_USER: ${DB_USERNAME:-librarymedia}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/librarymedia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-librarymedia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in the environment}
      OPEN_LIBRARY_USER_AGENT: ${OPEN_LIBRARY_USER_AGENT:-PersonalMediaLibrary/1.0}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://localhost:3000}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
